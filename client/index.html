<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Versículo Aleatório</title>

  <!-- 1. PWA: Link para o manifest.json e Cor do Tema -->
  <link rel="manifest" href="./manifest.json" />
  <!-- Mude o #000000 abaixo para a cor principal do seu jogo -->
  <meta name="theme-color" content="#000000" />

  <link rel="stylesheet" href="./main.css" />
  <link rel="icon" type="image/png" href="./lirio.png" />
</head>

<body>
  <audio id="audio" autoplay></audio>
  <div id="game-container"></div>

  <script src="./js/phaser.min.js"></script>
  <script type="module" src="./js/game.js"></script>

  <!-- 2. PWA: Registro do Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // O arquivo sw.js deve ser criado na mesma pasta deste index.html
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Service Worker registrado com sucesso: ', registration.scope);
          })
          .catch((error) => {
            console.log('Falha ao registrar o Service Worker: ', error);
          });
      });
    }
  </script>
</body>

</html>
